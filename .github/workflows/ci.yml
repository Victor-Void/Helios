name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Fast checks — run first, fail fast
  # ═══════════════════════════════════════════════════════════════════════════════
  i18n:
    name: i18n keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate translation key parity
        run: ./scripts/i18n-check.sh

  quick-build:
    name: Build (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Helios.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libwayland-dev upx-ucl libpipewire-0.3-dev pkg-config
      - name: Restore
        run: dotnet restore src/ --runtime linux-x64
      - name: Build (non-AOT, fast)
        run: dotnet build src/ -c Release --no-restore -p:PublishAot=false
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
      - uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Helios.csproj') }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # Tests — depends on quick-build passing
  # ═══════════════════════════════════════════════════════════════════════════════
  csharp-tests:
    name: C# tests
    needs: [quick-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - name: Restore
        run: dotnet restore tests/Helios.Tests
      - name: Run GPU mode scenarios
        run: dotnet run -c Debug --project tests/Helios.Tests

  bash-tests:
    name: Boot script tests
    needs: [quick-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GPU boot scenarios
        run: bash install/tests/test-helios-gpu-boot.sh

  # ═══════════════════════════════════════════════════════════════════════════════
  # Full AOT build + verify — runs only when all tests pass
  # ═══════════════════════════════════════════════════════════════════════════════
  aot-build:
    name: Build (AOT)
    needs: [quick-build, csharp-tests, bash-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On PRs, stamp a unique version so the artifact is identifiable.
      - name: Stamp PR version
        if: github.event_name == 'pull_request'
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${SHORT_SHA}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/Helios.csproj
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" install/90-helios.rules

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Helios.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install AOT deps
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libwayland-dev upx-ucl libpipewire-0.3-dev pkg-config

      - name: Build AOT binary
        run: ./build.sh

      - name: Verify embedded resources
        run: |
          set -e
          cd dist
          EXPECTED=(gpu-helper ryzenadj gpu-block-helper.sh helios-gpu-boot.sh 90-helios.rules libSkiaSharp.so libHarfBuzzSharp.so helios-audio wlr-randr)
          for res in "${EXPECTED[@]}"; do
            out="/tmp/smoke-${res}"
            rm -f "$out"
            if ! ./helios --extract-helper "$res" "$out" >/dev/null 2>&1; then
              echo "ERROR: embedded resource '$res' not found"
              exit 1
            fi
            size=$(stat -c%s "$out")
            if (( size < 100 )); then
              echo "ERROR: resource '$res' too small ($size bytes)"
              exit 1
            fi
            echo "  ok: $res ($size bytes)"
          done
          for bin in gpu-helper ryzenadj; do
            if ! file "/tmp/smoke-${bin}" | grep -q "ELF.*executable"; then
              echo "ERROR: ${bin} is not a valid ELF executable"
              exit 1
            fi
          done
          echo "All embedded resources verified"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: helios
          path: dist/helios
          retention-days: 7

      - name: Upload udev rules
        uses: actions/upload-artifact@v4
        with:
          name: udev-rules
          path: install/90-helios.rules
          retention-days: 7

      - name: Upload boot files
        uses: actions/upload-artifact@v4
        with:
          name: gpu-boot-files
          path: |
            install/helios-gpu-boot.sh
            install/helios-gpu-boot.service
          retention-days: 7

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-meta.txt
          echo "${{ github.event.pull_request.head.sha }}" >> pr-meta.txt

      - name: Upload PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-meta
          path: pr-meta.txt
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # AppImage — PR only, for download-link-in-comment purposes
  # ═══════════════════════════════════════════════════════════════════════════════
  appimage:
    name: AppImage
    needs: [aot-build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helios
          path: artifacts/helios
      - name: Install libfuse2
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Download appimagetool
        run: |
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
      - name: Assemble + build AppImage
        run: |
          mkdir -p Helios.AppDir/usr/bin
          cp artifacts/helios/helios Helios.AppDir/usr/bin/
          chmod +x Helios.AppDir/usr/bin/helios
          cp install/helios.desktop Helios.AppDir/helios.desktop
          cp install/helios.png Helios.AppDir/helios.png
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/helios" "$@"\n' > Helios.AppDir/AppRun
          chmod +x Helios.AppDir/AppRun
          export ARCH=x86_64
          ./appimagetool Helios.AppDir Helios-x86_64.AppImage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Helios-x86_64.AppImage
          retention-days: 7
